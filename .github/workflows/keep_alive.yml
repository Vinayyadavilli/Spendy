name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes to prevent Render free instance spin-down
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -s -I "https://spendy-vxyb.onrender.com/api/health" || echo "Ping failed"
